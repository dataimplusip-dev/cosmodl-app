name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Project Scaffolding
        run: |
          mkdir -p /tmp/mycode
          cp -r lib /tmp/mycode/
          flutter create --org com.naim.cosmodl --project-name cosmodl .
          rm -rf lib
          cp -r /tmp/mycode/lib .
          flutter pub add youtube_explode_dart path_provider permission_handler

      - name: Fix Android Permissions & MinSdk
        run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f: content = f.read()
          perms = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n<uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>\n<uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n'
          content = content.replace('<application', perms + '<application')
          with open(path, 'w') as f: f.write(content)
          "
          python3 -c "
          for p in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              try:
                  with open(p, 'r') as f: c = f.read()
                  c = c.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
                  c = c.replace('minSdk = flutter.minSdk', 'minSdk = 21')
                  with open(p, 'w') as f: f.write(c)
              except Exception: pass
          "

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CosmoDL-App-Release
          path: build/app/outputs/flutter-apk/app-release.apk
